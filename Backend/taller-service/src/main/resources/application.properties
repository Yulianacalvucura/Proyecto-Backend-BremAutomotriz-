spring.application.name=taller-service
server.port=8081


spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/brem_automotriz}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false


springdoc.api-docs.path=/taller/v3/api-docs
springdoc.swagger-ui.path=/taller/swagger-ui.html
