spring.application.name=auth-usuarios-service

# Base de datos MySQL compartida. El esquema lo crea database/mysql/brem_automotriz.sql
# (ejecutado una vez por un administrador; la aplicacion no gestiona DDL).
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${BREM_DB_HOST:localhost}:${BREM_DB_PORT:3306}/${BREM_DB_NAME:brem_automotriz}
# Credenciales fuera del repo: SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD
# (para este servicio, la cuenta brem_usuarios_svc creada en el script).

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
