server:
  port: 9090

jwt:
  secret: ${JWT_SECRET}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: http://localhost:8091
            predicates:
              - Path=/auth/**
          - id: clientes-service
            uri: http://localhost:8081
            predicates:
              - Path=/clientes/**
          - id: vehiculos-service
            uri: http://localhost:8081
            predicates:
              - Path=/vehiculos/**
          - id: ordenes-service
            uri: http://localhost:8081
            predicates:
              - Path=/ordenes/**
          - id: auth-docs
            uri: http://localhost:8091
            predicates:
              - Path=/api/v1/auth/v3/api-docs
          - id: taller-docs
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/taller/v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: Servicio Auth
        url: /api/v1/auth/v3/api-docs
      - name: Servicio Taller
        url: /api/v1/taller/v3/api-docs
