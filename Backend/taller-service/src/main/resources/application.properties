spring.application.name=taller-service
server.port=8081

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/brem_automotriz
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo crea database/mysql/brem_automotriz.sql: Hibernate no lo modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

springdoc.api-docs.path=/api/v1/taller/v3/api-docs
springdoc.swagger-ui.path=/api/v1/taller/swagger-ui.html
springdoc.swagger-ui.enabled=true
server.forward-headers-strategy=framework
