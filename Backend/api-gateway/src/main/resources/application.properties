spring.application.name=api-gateway
server.port=9090
jwt.secret=${JWT_SECRET}

# URLs de los microservicios (configurables; valores por defecto para desarrollo).
servicios.auth.url=${AUTH_SERVICE_URL:http://localhost:8091}
servicios.taller.url=${TALLER_SERVICE_URL:http://localhost:8081}

# Timeouts del cliente HTTP imperativo usado por Spring Cloud Gateway MVC.
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=30s

# Prefijo de propiedades de Spring Cloud Gateway Server Web MVC (variante servlet, NO webflux).
# Las rutas de documentacion van primero para que no sean capturadas por /auth/** o /taller/**.
spring.cloud.gateway.server.webmvc.routes[0].id=auth-swagger-ui
spring.cloud.gateway.server.webmvc.routes[0].uri=${servicios.auth.url}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/swagger-ui.html,/auth/swagger-ui/**
spring.cloud.gateway.server.webmvc.routes[1].id=auth-api-docs
spring.cloud.gateway.server.webmvc.routes[1].uri=${servicios.auth.url}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/auth/v3/api-docs,/auth/v3/api-docs/**
spring.cloud.gateway.server.webmvc.routes[2].id=auth-api
spring.cloud.gateway.server.webmvc.routes[2].uri=${servicios.auth.url}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webmvc.routes[3].id=taller-swagger-ui
spring.cloud.gateway.server.webmvc.routes[3].uri=${servicios.taller.url}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/taller/swagger-ui.html,/taller/swagger-ui/**
spring.cloud.gateway.server.webmvc.routes[4].id=taller-api-docs
spring.cloud.gateway.server.webmvc.routes[4].uri=${servicios.taller.url}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/taller/v3/api-docs,/taller/v3/api-docs/**
spring.cloud.gateway.server.webmvc.routes[5].id=clientes
spring.cloud.gateway.server.webmvc.routes[5].uri=${servicios.taller.url}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/clientes/**
spring.cloud.gateway.server.webmvc.routes[6].id=vehiculos
spring.cloud.gateway.server.webmvc.routes[6].uri=${servicios.taller.url}
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/vehiculos/**
spring.cloud.gateway.server.webmvc.routes[7].id=ordenes
spring.cloud.gateway.server.webmvc.routes[7].uri=${servicios.taller.url}
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/ordenes/**
spring.cloud.gateway.server.webmvc.routes[8].id=taller-api
spring.cloud.gateway.server.webmvc.routes[8].uri=${servicios.taller.url}
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/taller/**

# Swagger agrupado del gateway.
springdoc.swagger-ui.urls[0].name=Auth
springdoc.swagger-ui.urls[0].url=/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=Taller
springdoc.swagger-ui.urls[1].url=/taller/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true

# Actuator: solo health e info.
management.endpoints.web.exposure.include=health,info
